# Alternativa a una instalación local de PostgreSQL 16 (ver README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: consultorio
      POSTGRES_PASSWORD: consultorio
      POSTGRES_DB: consultorio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
